name: Android

# Builds the phone APK and checks that both front ends are really in it.
#
# Why this runs on a hosted runner: the APK needs an exact toolchain (NDK 29.0.14206865, a JDK
# 17-21, Android SDK 37.0) and links wgpu/eframe for arm64, which wants several GB of RAM. A
# development machine that has neither cannot build it at all, and this is the thing that proves
# the hand-off wiring is real.
#
# What it CANNOT do: reach a phone. A hosted runner has no USB, so installing and running on a
# device is a separate, deliberate step - download the `wordcraft-apk` artifact from the run and
# `adb install` it (see docs/pocket-mode.md). The `verify` job therefore checks the APK's own
# contents instead of claiming a device test it never ran.
on:
  push:
    branches: [main, 'pocket-mode', 'android/**']
  pull_request:
    paths:
      - 'apps/wordcraft-android-compose/**'
      - 'apps/wordcraft-android/**'
      - 'crates/android-bridge/**'
      - 'crates/layout/**'
      - 'crates/engine/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a newer push cancels the older run's build, so only the newest APK of a
# branch survives.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The same versions the Gradle project pins. Keep these in step with
  # apps/wordcraft-android-compose/android/app/build.gradle.kts (`ndkVersion`) and
  # apps/wordcraft-android-compose/BUILD-NOTES.md.
  NDK_VERSION: 29.0.14206865
  RUST_ABI: arm64-v8a

jobs:
  # The Rust half first: it is what the Gradle build compiles, and a failure here is far cheaper to
  # read than the same failure through Gradle.
  rust:
    name: Rust (bridge tests, gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bridge and entry-crate tests
        # The entry crate's pins cover the JNI paths that only run on a device: the front-end
        # hand-off and the "desktop interface is up" report, both read through the app's loader.
        run: cargo test -p wordcraft-android-bridge -p wordcraft-android
      - name: Layering
        run: cargo xtask layers
      - name: Assets are all attributed
        run: cargo xtask assets

  apk:
    name: APK (arm64)
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # The Android Gradle Plugin needs a compiler-capable JDK; 25 is refused, 17 is what the
          # app targets. See BUILD-NOTES.md.
          distribution: temurin
          java-version: '17'

      # API 37 ships as the minor-versioned package `platforms;android-37.0`; the bare
      # `platforms;android-37` is not in Google's package index and sdkmanager fails with
      # "Failed to find package". `compileSdk = 37` in app/build.gradle.kts resolves to that
      # android-37.0 platform, as the locally installed SDK shows.
      - name: Android SDK (platform 37.0)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;35.0.0 platform-tools'

      - name: Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" >/dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-apk

      - name: Build the APK
        working-directory: apps/wordcraft-android-compose/android
        run: ./gradlew --no-daemon -Pwordcraft.abis=${{ env.RUST_ABI }} :app:assembleDebug

      - name: Find the APK
        id: apk
        run: |
          set -euo pipefail
          found="$(find apps/wordcraft-android-compose/android/app/build/outputs/apk -name '*.apk' | head -1)"
          test -n "$found" || { echo "no APK produced"; find apps/wordcraft-android-compose/android/app/build -name '*.apk'; exit 1; }
          echo "path=$found" >> "$GITHUB_OUTPUT"
          echo "APK: $found"

      # The checks a device would otherwise prove first: both front ends' libraries are in the APK,
      # and both activities are declared. `aapt2 dump` reads the packaged manifest, so this is the
      # shipped artifact, not the source.
      - name: Both front ends are in the APK
        env:
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          echo "--- native libraries"
          unzip -l "$APK" | grep -E 'lib/.*\.so' || { echo "no .so in the APK"; exit 1; }
          for lib in libwordcraft_android_bridge.so libwordcraft_android.so; do
            unzip -l "$APK" | grep -q "$lib" || { echo "missing $lib"; exit 1; }
            echo "ok: $lib"
          done
          echo "--- manifest activities"
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)"
          "$aapt2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/manifest.txt
          for act in 'DesktopActivity' 'MainActivity'; do
            grep -q "$act" /tmp/manifest.txt || { echo "missing activity $act"; exit 1; }
            echo "ok: $act"
          done
          # Desktop Mode is landscape only, and Pocket Mode still turns with the device, checked by activity
          # block rather than by grepping the dump: `aapt2 dump xmltree` prints enum attributes as NUMBERS and
          # never the words - screenOrientation(0x0101001e)=0 is landscape, =1 portrait, =-1 unspecified, and
          # the attribute is omitted when the manifest declares nothing. Grepping for the word "landscape"
          # fails on a correctly pinned APK, which is what run 42176542755 did. The number landscape maps to
          # is read from a fixture built here with the runner's own framework table, so nothing is hardcoded;
          # the source manifest is checked separately for the spelling that produces it.
          echo "--- Desktop Mode is landscape, Pocket Mode still turns"
          cat > /tmp/orientation-fixture.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="io.github.artcraftandroid.orientationfixture">
              <application>
                  <activity android:name=".LandscapeActivity" android:screenOrientation="landscape"/>
              </application>
          </manifest>
          XML
          framework="$(ls "$ANDROID_HOME"/platforms/*/android.jar | head -1)"
          "$aapt2" link -o /tmp/orientation-fixture.apk -I "$framework" --manifest /tmp/orientation-fixture.xml >/dev/null
          "$aapt2" dump xmltree --file AndroidManifest.xml /tmp/orientation-fixture.apk > /tmp/orientation-fixture.txt
          python3 - <<'PY'
          import re, sys
          
          def activity_blocks(dump):
              """One element's own lines: until the next element at the same indent or shallower."""
              rows = dump.splitlines()
              blocks = []
              for i, row in enumerate(rows):
                  if not row.strip().startswith("E: activity"):
                      continue
                  indent = len(row) - len(row.lstrip())
                  body = []
                  j = i + 1
                  while j < len(rows):
                      nxt = rows[j]
                      if nxt.strip().startswith("E:") and len(nxt) - len(nxt.lstrip()) <= indent:
                          break
                      body.append(nxt)
                      j += 1
                  blocks.append("\n".join(body))
              return blocks
          
          def name_of(block):
              m = re.search(r"android:name\(0x[0-9a-f]+\)=" + '"([^"]+)"', block)
              return m.group(1) if m else None
          
          def orientation_of(block):
              m = re.search(r"android:screenOrientation\(0x[0-9a-f]+\)=(-?\d+)", block)
              return int(m.group(1)) if m else None
          
          landscape = None
          for block in activity_blocks(open("/tmp/orientation-fixture.txt").read()):
              if orientation_of(block) is not None:
                  landscape = orientation_of(block)
          if landscape is None:
              sys.exit("aapt2 dumped no screenOrientation for a fixture that declares landscape")
          print("  aapt2 dumps landscape as", landscape)
          
          packaged = {}
          for block in activity_blocks(open("/tmp/manifest.txt").read()):
              name = name_of(block)
              if name:
                  packaged[name] = orientation_of(block)
          for name, orient in sorted(packaged.items()):
              print("  packaged", name, "screenOrientation", orient)
          def phone(values):
              """The phone activity, however its name was spelled: ".MainActivity" resolves against the
              source package, so the packaged dump shows io.github.artcraftandroid.wordcraft.MainActivity
              even with the debug applicationIdSuffix. Matches by the last name segment."""
              for name, value in values.items():
                  if name == "MainActivity" or name.endswith(".MainActivity"):
                      return name, value
              return None, None
          
          def desktop(values):
              """The desktop front end's activity, however its name was spelled: ".DesktopActivity"
              resolves against the source package, so the packaged dump shows
              io.github.artcraftandroid.wordcraft.DesktopActivity. Matches by the last name segment."""
              for name, value in values.items():
                  if name == "DesktopActivity" or name.endswith(".DesktopActivity"):
                      return name, value
              return None, None

          desktop_name, desktop = desktop(packaged)
          if desktop_name is None:
              sys.exit("no desktop activity in the packaged manifest")
          if desktop != landscape:
              sys.exit("the desktop front end is not pinned to landscape: " + repr(desktop))
          phone_name, phone_orient = phone(packaged)
          if phone_name is None:
              sys.exit("no phone activity in the packaged manifest")
          if phone_orient is not None:
              sys.exit("the phone activity " + phone_name + " pins " + str(phone_orient) + "; Pocket Mode must follow the sensor")
          
          source = open("apps/wordcraft-android-compose/android/app/src/main/AndroidManifest.xml").read()
          declared = {}
          for element in re.findall(r"<activity\b[^>]*>", source, re.S):
              name = re.search("android:name=\"([^\"]+)\"", element)
              orient = re.search("android:screenOrientation=\"([^\"]+)\"", element)
              declared[name.group(1) if name else "?"] = orient.group(1) if orient else None
          for name, orient in sorted(declared.items()):
              print("  source declares", name, "screenOrientation", orient)
          src_desktop_name, src_desktop = desktop(declared)
          if src_desktop_name is None:
              sys.exit("no desktop activity in the source manifest")
          if src_desktop != "landscape":
              sys.exit("the desktop front end does not declare landscape: " + repr(src_desktop))
          src_phone_name, src_phone_orient = phone(declared)
          if src_phone_name is None:
              sys.exit("no phone activity in the source manifest")
          if src_phone_orient is not None:
              sys.exit("the phone activity " + src_phone_name + " declares " + src_phone_orient + "; Pocket Mode must follow the sensor")
          print("ok: Desktop Mode is pinned to landscape, the phone activity follows the sensor")
          PY
          echo "--- launcher entry"
          grep -q 'android.intent.category.LAUNCHER' /tmp/manifest.txt || { echo "no launcher"; exit 1; }

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-apk
          path: ${{ steps.apk.outputs.path }}
          # Keep the run's newest APK only; the branch's older runs are cancelled by concurrency
          # above, and a stale artifact is worse than none.
          retention-days: 14
          if-no-files-found: error
